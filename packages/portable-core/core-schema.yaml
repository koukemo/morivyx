format: "morivyx.schema/0.1"
schemaId: "morivyx.core"
version: "0.1"
stableIdScheme: "urn-uuid-v4"
digestAlgorithm: "sha256"
reviewStates:
  - "approved"
  - "proposed"
  - "rejected"
  - "unreviewed"
entityTypes:
  - typeId: "core.actor"
    requiredAttributes:
      - "actorKind"
      - "name"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.artifact"
    requiredAttributes:
      - "artifactKind"
      - "uri"
    optionalAttributes:
      - "digest"
      - "externalVersion"
      - "mediaType"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.constraint"
    requiredAttributes:
      - "rule"
      - "severity"
    optionalAttributes:
      - "condition"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.context"
    requiredAttributes:
      - "scope"
    optionalAttributes:
      - "environment"
      - "timeRange"
      - "trustBoundary"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.criterion"
    requiredAttributes:
      - "evaluationRule"
      - "method"
      - "necessity"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.decision"
    requiredAttributes:
      - "consequences"
      - "question"
      - "rationale"
    optionalAttributes:
      - "challengeReview"
      - "revisitTriggers"
    lifecycle:
      - "accepted"
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.execution"
    requiredAttributes:
      - "actor"
      - "executedAt"
      - "outcome"
    optionalAttributes:
      - "idempotencyKey"
      - "inputs"
    lifecycle:
      - "accepted"
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.external-source"
    requiredAttributes:
      - "externalId"
      - "system"
    optionalAttributes:
      - "snapshotAt"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.goal"
    requiredAttributes:
      - "beneficiaries"
      - "scope"
      - "statement"
    optionalAttributes:
      - "horizon"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.intent"
    requiredAttributes:
      - "motivation"
      - "priority"
    optionalAttributes:
      - "interpretation"
      - "nonNegotiables"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.knowledge"
    requiredAttributes:
      - "claim"
      - "epistemicState"
      - "scope"
    optionalAttributes:
      - "confidence"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.learning"
    requiredAttributes:
      - "insight"
    optionalAttributes:
      - "confidence"
      - "recommendedChange"
    lifecycle:
      - "active"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.observation"
    requiredAttributes:
      - "method"
      - "observedAt"
      - "value"
    lifecycle:
      - "accepted"
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.option"
    requiredAttributes:
      - "description"
    optionalAttributes:
      - "tradeoffs"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.plan"
    requiredAttributes:
      - "actions"
    optionalAttributes:
      - "dependencies"
      - "stopConditions"
    lifecycle:
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
  - typeId: "core.verification"
    requiredAttributes:
      - "method"
      - "result"
    lifecycle:
      - "accepted"
      - "active"
      - "deprecated"
      - "draft"
      - "retracted"
      - "superseded"
relationTypes:
  - predicate: "addresses"
    sourceTypes:
      - "core.decision"
    targetTypes:
      - "core.goal"
      - "core.intent"
      - "core.knowledge"
    minCount: 0
    maxCount: null
    cycle: "not_applicable"
  - predicate: "against"
    sourceTypes:
      - "core.verification"
    targetTypes:
      - "core.criterion"
    minCount: 1
    maxCount: 1
    cycle: "not_applicable"
  - predicate: "challenged_by"
    sourceTypes:
      - "core.decision"
      - "core.knowledge"
    targetTypes:
      - "core.knowledge"
      - "core.observation"
    minCount: 0
    maxCount: null
    cycle: "not_applicable"
  - predicate: "considers"
    sourceTypes:
